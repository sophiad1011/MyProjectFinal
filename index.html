<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Planner</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, red, green);
      background-size: 400% 400%;
      animation: gradientAnimation 10s ease infinite;
      color: #fff;
    }

    @keyframes gradientAnimation {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .calendar {
      text-align: center;
      padding: 20px;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      margin-top: 20px;
    }

    .day {
      background: #ffcccc;
      border: 2px solid #ff6666;
      padding: 20px;
      cursor: pointer;
      border-radius: 5px;
      font-size: 1.2em;
      font-weight: bold;
      color: #333;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .day:hover {
      transform: scale(1.1);
      box-shadow: 0 0 10px #ff6666;
    }

    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      width: 80%;
      max-width: 400px;
      color: #333;
    }

    #task-list {
      list-style: none;
      padding: 0;
      margin: 20px 0;
      background: #f9f9f9;
      border-radius: 10px;
      padding: 10px;
    }

    #task-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 10px 0;
      padding: 10px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 5px;
      color: #333;
      font-weight: bold;
      transition: transform 0.3s, background 0.3s;
    }

    #task-list li:hover {
      transform: scale(1.05);
      background: #f0f0f0;
    }

    #task-list li.completed {
      text-decoration: line-through;
      color: #999;
      background: #e0e0e0;
    }

    .progress-container {
      margin: 20px 0;
      background: #ddd;
      border-radius: 10px;
      height: 20px;
      width: 100%;
      overflow: hidden;
    }

    .progress-bar {
      background: #66ff66;
      height: 100%;
      width: 0;
      transition: width 0.3s;
    }

    #congrats-message {
      font-size: 1.5em;
      color: #ff66ff;
      animation: glow 1s infinite alternate;
    }

    #congrats-message.hidden {
      display: none;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 10px #ff66ff, 0 0 20px #ff66ff;
      }
      to {
        text-shadow: 0 0 20px #ff66ff, 0 0 30px #ff66ff;
      }
    }
  </style>
</head>
<body>
  <div class="calendar">
    <h1 id="month-year" style="color: darkred; text-align: center;">November 2026</h1>
    <div style="text-align: center; margin-bottom: 20px;">
      <button id="prev-month" style="padding: 10px; margin-right: 10px;">Previous</button>
      <button id="next-month" style="padding: 10px;">Next</button>
    </div>
    <div class="days">
      <!-- Days of the month will be dynamically generated -->
    </div>
  </div>

  <div class="modal hidden">
    <div class="modal-content">
      <h2 id="selected-date"></h2>
      <ul id="task-list"></ul>
      <input type="text" id="new-task" placeholder="Add a new task">
      <button id="add-task">Add Task</button>
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      <div id="congrats-message" class="hidden">🎉 Congrats, you did it! 🎉</div>
      <button id="close-modal">Close</button>
    </div>
  </div>

  <p style="text-align: center; margin-top: 20px; font-size: 1.2em; color: #fff;">
    Our mission is to make your lives a little bit easier with this planner. Plan everything ahead and make your lives a bit easier.
  </p>

  <script>
    const daysContainer = document.querySelector('.days');
    const modal = document.querySelector('.modal');
    const selectedDate = document.getElementById('selected-date');
    const taskList = document.getElementById('task-list');
    const newTaskInput = document.getElementById('new-task');
    const addTaskButton = document.getElementById('add-task');
    const progressBar = document.querySelector('.progress-bar');
    const congratsMessage = document.getElementById('congrats-message');
    const closeModalButton = document.getElementById('close-modal');
    const monthYearElement = document.getElementById('month-year');
    const prevMonthButton = document.getElementById('prev-month');
    const nextMonthButton = document.getElementById('next-month');

    const tasks = {};

    let currentDate = new Date(2026, 10); // November 2026

    function renderCalendar() {
      const month = currentDate.getMonth();
      const year = currentDate.getFullYear();
      const monthName = currentDate.toLocaleString('default', { month: 'long' });

      monthYearElement.textContent = `${monthName} ${year}`;
      daysContainer.innerHTML = '';

      const daysInMonth = new Date(year, month + 1, 0).getDate();

      for (let i = 1; i <= daysInMonth; i++) {
        const day = document.createElement('div');
        day.classList.add('day');
        day.textContent = i;

        const today = new Date();
        if (year === today.getFullYear() && month === today.getMonth() && i === today.getDate()) {
          day.style.backgroundColor = '#ff6666';
          day.style.color = '#fff';
          day.style.fontWeight = 'bold';
        }

        day.addEventListener('click', () => openModal(i));
        daysContainer.appendChild(day);
      }
    }

    prevMonthButton.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar();
    });

    nextMonthButton.addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar();
    });

    function openModal(day) {
      const monthName = currentDate.toLocaleString('default', { month: 'long' });
      const year = currentDate.getFullYear();
      selectedDate.textContent = `Tasks for ${monthName} ${day}, ${year}`;
      taskList.innerHTML = '';
      const dayTasks = tasks[`${year}-${currentDate.getMonth()}-${day}`] || [];
      dayTasks.forEach((task, index) => {
        const taskItem = document.createElement('li');
        taskItem.textContent = task.text;
        taskItem.classList.toggle('completed', task.completed);
        taskItem.addEventListener('click', () => toggleTask(`${year}-${currentDate.getMonth()}-${day}`, index));
        taskList.appendChild(taskItem);
      });
      updateProgress(`${year}-${currentDate.getMonth()}-${day}`);
      modal.classList.remove('hidden');
    }

    function closeModal() {
      modal.classList.add('hidden');
    }

    function addTask() {
      const day = parseInt(selectedDate.textContent.match(/\d+/)[0]);
      const month = currentDate.getMonth();
      const year = currentDate.getFullYear();
      const taskText = newTaskInput.value.trim();
      if (!taskText) return;
      const key = `${year}-${month}-${day}`;
      if (!tasks[key]) tasks[key] = [];
      tasks[key].push({ text: taskText, completed: false });
      newTaskInput.value = '';
      openModal(day);
    }

    function toggleTask(key, index) {
      tasks[key][index].completed = !tasks[key][index].completed;
      openModal(parseInt(key.split('-')[2]));
    }

    function updateProgress(key) {
      const dayTasks = tasks[key] || [];
      const completedTasks = dayTasks.filter(task => task.completed).length;
      const progress = dayTasks.length ? (completedTasks / dayTasks.length) * 100 : 0;
      progressBar.style.width = `${progress}%`;
      if (progress === 100) {
        congratsMessage.classList.remove('hidden');
      } else {
        congratsMessage.classList.add('hidden');
      }
    }

    addTaskButton.addEventListener('click', addTask);
    closeModalButton.addEventListener('click', closeModal);

    renderCalendar();
  </script>
</body>
</html>
