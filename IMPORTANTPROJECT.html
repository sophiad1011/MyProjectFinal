<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Planner</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #006400, #8B0000);
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
    }

    /* Progress Bar Styles */
    .progress-container {
      margin: 20px auto;
      width: 80%;
      background: #ddd;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      height: 30px;
      width: 0%;
      background: #32CD32;
      text-align: center;
      line-height: 30px;
      color: #fff;
      border-radius: 20px;
    }

    .congratulations {
      display: none;
      margin-top: 20px;
    }

    /* Calendar Styles */
    .calendar-container {
      max-width: 900px;
      margin: 50px auto;
      padding: 20px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 10px;
    }

    .calendar-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .calendar-header button {
      background-color: #FF6347;
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 5px;
      cursor: pointer;
    }

    .calendar-header button:hover {
      background-color: #FF4500;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
    }

    .day {
      background: rgba(255, 255, 255, 0.1);
      padding: 20px;
      border-radius: 5px;
      text-align: center;
      cursor: pointer;
    }

    .day.task {
      background: rgba(50, 205, 50, 0.8);
    }

    .day span {
      display: block;
      font-size: 14px;
      margin-top: 10px;
    }

    .task-form {
      margin-top: 20px;
    }

    .task-form input, .task-form button {
      padding: 10px;
      margin: 5px;
      border: none;
      border-radius: 5px;
    }

    .task-form button {
      background-color: #32CD32;
      color: #fff;
      cursor: pointer;
    }

    .task-form button:hover {
      background-color: #228B22;
    }
  </style>
</head>
<body>
  <!-- Introductory Section -->
  <div class="container">
    <h1>Welcome to Advanced Planner</h1>
    <p>Plan your tasks efficiently and effectively.</p>
  </div>

  <!-- Progress Bar Section -->
  <div class="progress-container">
    <div class="progress-bar" id="progressBar">0%</div>
  </div>
  <img src="congratulations.png" alt="Congratulations!" class="congratulations" id="congratulationsImage">

  <!-- Calendar Section -->
  <div class="calendar-container">
    <div class="calendar-header">
      <button onclick="prevMonth()">Previous</button>
      <h2 id="monthYear">March 2023</h2>
      <button onclick="nextMonth()">Next</button>
    </div>
    <div class="calendar-grid" id="calendarGrid">
      <!-- Calendar days will be dynamically generated -->
    </div>
    <div class="task-form">
      <input type="number" id="taskDay" placeholder="Day (1-31)" min="1" max="31">
      <input type="text" id="taskDescription" placeholder="Task Description">
      <button onclick="addTask()">Add Task</button>
    </div>
  </div>

  <script>
    // Progress Bar Logic
    const progressBar = document.getElementById('progressBar');
    const congratulationsImage = document.getElementById('congratulationsImage');
    let progress = 0;

    function updateProgressBar() {
      progress += 10; // Increment progress by 10%
      if (progress > 100) progress = 100; // Cap progress at 100%
      progressBar.style.width = progress + '%';
      progressBar.textContent = progress + '%';

      if (progress === 100) {
        congratulationsImage.style.display = 'block'; // Show congratulations image
      }
    }

    // Calendar Logic
    const calendarGrid = document.getElementById('calendarGrid');
    const monthYear = document.getElementById('monthYear');
    const tasks = {}; // Object to store tasks by date
    let currentDate = new Date();

    function renderCalendar(date) {
      const year = date.getFullYear();
      const month = date.getMonth();
      const firstDay = new Date(year, month, 1).getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      monthYear.textContent = date.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });

      calendarGrid.innerHTML = '';

      // Add empty days for the first week
      for (let i = 0; i < firstDay; i++) {
        const emptyDay = document.createElement('div');
        emptyDay.classList.add('day');
        calendarGrid.appendChild(emptyDay);
      }

      // Add days of the month
      for (let day = 1; day <= daysInMonth; day++) {
        const dayElement = document.createElement('div');
        dayElement.classList.add('day');
        dayElement.textContent = day;

        // Check if there are tasks for this day
        const taskKey = `${year}-${month}-${day}`;
        if (tasks[taskKey]) {
          dayElement.classList.add('task');
          const task = document.createElement('span');
          task.textContent = tasks[taskKey];
          dayElement.appendChild(task);
        }

        calendarGrid.appendChild(dayElement);
      }
    }

    function prevMonth() {
      currentDate.setMonth(currentDate.getMonth() - 1);
      renderCalendar(currentDate);
    }

    function nextMonth() {
      currentDate.setMonth(currentDate.getMonth() + 1);
      renderCalendar(currentDate);
    }

    function addTask() {
      const taskDay = parseInt(document.getElementById('taskDay').value, 10);
      const taskDescription = document.getElementById('taskDescription').value;

      if (!taskDay || !taskDescription) {
        alert('Please enter a valid day and task description.');
        return;
      }

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();
      const taskKey = `${year}-${month}-${taskDay}`;

      tasks[taskKey] = taskDescription;
      renderCalendar(currentDate);

      // Clear input fields
      document.getElementById('taskDay').value = '';
      document.getElementById('taskDescription').value = '';

      // Update progress bar
      updateProgressBar();
    }

    // Initialize calendar
    renderCalendar(currentDate);
  </script>
</body>
</html>
