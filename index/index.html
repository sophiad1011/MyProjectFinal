<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Planner</title>
  <style>
    /* General Styles */
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #006400, #8B0000);
      color: #fff;
      margin: 0;
      padding: 0;
      text-align: center;
    }

    .container {
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 20px;
      color: #FFD700;
      text-shadow: 2px 2px 5px #FF4500;
    }

    input[type="text"] {
      width: 70%;
      padding: 10px;
      font-size: 1rem;
      border: 2px solid #FFD700;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    button {
      padding: 10px 20px;
      font-size: 1rem;
      color: #fff;
      background-color: #FF4500;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, background-color 0.3s ease;
    }

    button:hover {
      transform: scale(1.1);
      background-color: #FFD700;
    }

    ul {
      list-style: none;
      padding: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
      margin: 10px 0;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    li.completed {
      text-decoration: line-through;
      color: #888;
    }

    .progress-container {
      margin-top: 20px;
      position: relative;
      height: 30px;
      width: 100%;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #FFD700, #FF4500);
      transition: width 0.3s ease;
    }

    .progress-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-weight: bold;
      color: #fff;
      text-shadow: 1px 1px 3px #000;
    }

    .hidden {
      display: none;
    }

    /* Rainbow Congratulations */
    #congratulationsText {
      font-size: 2.5rem;
      font-family: 'Comic Sans MS', cursive, sans-serif;
      background: linear-gradient(90deg, red, orange, yellow, green, blue, indigo, violet);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: sparkle 2s infinite;
      margin-top: 20px;
    }

    @keyframes sparkle {
      0% {
        text-shadow: 0 0 5px red, 0 0 10px orange, 0 0 15px yellow;
      }
      50% {
        text-shadow: 0 0 10px green, 0 0 15px blue, 0 0 20px violet;
      }
      100% {
        text-shadow: 0 0 5px red, 0 0 10px orange, 0 0 15px yellow;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Advanced Planner</h1>
    <input type="text" id="taskInput" placeholder="Enter a new task">
    <button id="addTaskButton">Add Task</button>
    <ul id="taskList"></ul>
    <div class="progress-container">
      <div class="progress-bar" id="progressBar"></div>
      <div class="progress-text" id="progressText">0%</div>
    </div>
    <h2 id="congratulationsText" class="hidden">🎉 Congratulations! You did it! 🎉</h2>
  </div>

  <script>
    const taskInput = document.getElementById('taskInput');
    const addTaskButton = document.getElementById('addTaskButton');
    const taskList = document.getElementById('taskList');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const congratulationsText = document.getElementById('congratulationsText');

    let tasks = [];
    let completedTasks = 0;

    // Add a new task
    addTaskButton.addEventListener('click', () => {
      const taskText = taskInput.value.trim();
      if (taskText) {
        tasks.push({ text: taskText, completed: false });
        taskInput.value = '';
        renderTasks();
        updateProgress();
      }
    });

    // Render the task list
    function renderTasks() {
      taskList.innerHTML = '';
      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.textContent = task.text;
        li.className = task.completed ? 'completed' : '';
        li.addEventListener('click', () => toggleTask(index));
        taskList.appendChild(li);
      });
    }

    // Toggle task completion
    function toggleTask(index) {
      tasks[index].completed = !tasks[index].completed;
      completedTasks = tasks.filter(task => task.completed).length;
      renderTasks();
      updateProgress();
    }

    // Update the progress bar and show the congratulations message
    function updateProgress() {
      const totalTasks = tasks.length;
      const progress = totalTasks > 0 ? (completedTasks / totalTasks) * 100 : 0;
      progressBar.style.width = `${progress}%`;
      progressText.textContent = `${Math.round(progress)}%`;

      if (progress === 100 && totalTasks > 0) {
        congratulationsText.classList.remove('hidden');
      } else {
        congratulationsText.classList.add('hidden');
      }
    }
  </script>
</body>
</html>
